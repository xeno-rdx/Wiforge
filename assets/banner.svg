      <tspan x="450" dy="0">  ██╗    ██╗██╗███████╗ ██████╗ ██████╗  ██████╗ ███████╗</tspan>
      <tspan x="450" dy="22">  ██║    ██║██║██╔════╝██╔═══██╗██╔══██╗██╔════╝ ██╔════╝</tspan>
      <tspan x="450" dy="22">  ██║ █╗ ██║██║█████╗  ██║   ██║██████╔╝██║  ███╗█████╗  </tspan>
      <tspan x="450" dy="22">  ██║███╗██║██║██╔══╝  ██║   ██║██╔══██╗██║   ██║██╔══╝  </tspan>
      <tspan x="450" dy="22">  ╚███╔███╔╝██║██║     ╚██████╔╝██║  ██║╚██████╔╝███████╗</tspan>
      <tspan x="450" dy="22">   ╚══╝╚══╝ ╚═╝╚═╝      ╚═════╝ ╚═╝  ╚═╝ ╚═════╝ ╚══════╝</tspan>
    </text>
  </g>
  <!-- name -->
  <text x="450" y="470" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="38" font-weight="bold" letter-spacing="14" fill="#ffffff">WIFORGE</text>
  <text x="450" y="498" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" letter-spacing="3" fill="#8a8a8a">WPA/WPA2/WPA3 ANALYZER · DECRYPTOR</text>
