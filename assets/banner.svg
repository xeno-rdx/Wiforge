<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Wiforge - terminal banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="logoMask" maskContentUnits="objectBoundingBox">
      <rect x="0" y="0" width="1" height="1" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect x="1" y="1" width="898" height="518" rx="10" fill="#000000" stroke="#2b2b2b" stroke-width="2"/>
  <!-- title bar -->
  <rect x="1" y="1" width="898" height="38" rx="10" fill="#141414"/>
  <rect x="1" y="28" width="898" height="11" fill="#141414"/>
  <circle cx="28" cy="20" r="6" fill="#d00000"/>
  <circle cx="50" cy="20" r="6" fill="#4a4a4a"/>
  <circle cx="72" cy="20" r="6" fill="#4a4a4a"/>
  <text x="450" y="25" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#8a8a8a">Xeno@kali: ~</text>
  <!-- prompt -->
  <text x="30" y="72" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#d00000">Xeno@kali</text>
  <text x="112" y="72" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#8a8a8a">:~$</text>
  <text x="148" y="72" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#ffffff">wiforge -h</text>
  <rect x="242" y="59" width="9" height="16" fill="#d00000">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <!-- tool ASCII logo, faded at the edges like the skull on the profile banner -->
 
<g filter="url(#glow)">
